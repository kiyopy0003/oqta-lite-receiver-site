<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OQTA">
  <meta name="theme-color" content="#0a1628">
  <link rel="manifest" href="manifest.json">
  <title>OQTA Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --blue: #579BE4;
      --blue-dim: rgba(87,155,228,0.15);
      --bg: #0a1628;
      --card: #111e35;
      --text: #f0f4ff;
      --muted: rgba(240,244,255,0.45);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ── Setup screen ── */
    #setup {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 32px;
      gap: 16px;
    }
    #setup h1 { font-size: 28px; letter-spacing: .02em; }
    #setup p  { font-size: 14px; color: var(--muted); text-align: center; }
    #setup input {
      width: 100%;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid rgba(87,155,228,0.3);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-top: 8px;
    }
    #setup input:focus { border-color: var(--blue); }
    #connectBtn {
      width: 100%;
      padding: 16px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Main screen ── */
    #main {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 56px 24px 16px;
    }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
    .conn-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      background: var(--card);
      padding: 6px 12px;
      border-radius: 20px;
    }
    .conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* Receiver selector */
    .receiver-list {
      padding: 8px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 0 0 auto;
      max-height: 160px;
    }
    .receiver-chip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .receiver-chip.selected { border-color: var(--blue); }
    .receiver-chip .rdot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    .receiver-chip .rdot.online { background: #4CAF50; }
    .receiver-info { flex: 1; }
    .receiver-name { font-size: 14px; font-weight: 600; }
    .receiver-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Center area */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding-bottom: 40px;
    }

    /* Big send button */
    .send-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring {
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      opacity: 0;
    }
    .ring1 { animation: none; }
    .ring2 { animation: none; }
    .ring3 { animation: none; }

    @keyframes ring-out {
      0%   { transform: scale(1);   opacity: .6; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .ringing .ring1 { animation: ring-out 1.2s ease-out 0s    forwards; }
    .ringing .ring2 { animation: ring-out 1.2s ease-out .25s  forwards; }
    .ringing .ring3 { animation: ring-out 1.2s ease-out .5s   forwards; }

    #bigBtn {
      width: 160px; height: 160px;
      border-radius: 50%;
      background: var(--blue-dim);
      border: 2.5px solid var(--blue);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: background .2s, transform .1s;
      user-select: none;
    }
    #bigBtn:active { transform: scale(0.94); background: rgba(87,155,228,0.3); }
    #bigBtn.disabled { opacity: .5; pointer-events: none; }
    .btn-icon { font-size: 48px; line-height: 1; }
    .btn-label { font-size: 13px; font-weight: 600; color: var(--blue); letter-spacing: .04em; }

    /* Status text */
    #statusMsg {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      min-height: 20px;
      transition: color .3s;
      padding: 0 32px;
    }
    #statusMsg.ok    { color: #4CAF50; }
    #statusMsg.error { color: #ef5350; }

    /* Footer */
    .footer {
      padding: 12px 24px 32px;
      display: flex;
      justify-content: center;
    }
    .footer button {
      background: none;
      border: 1px solid rgba(255,255,255,.15);
      color: var(--muted);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .footer button:active { background: rgba(255,255,255,.05); }
  </style>
</head>
<body>

<!-- Setup screen -->
<div id="setup">
  <div style="font-size:48px">🕊</div>
  <h1>OQTA Sender</h1>
  <p>受信機にハートを届けるアプリです</p>
  <input type="password" id="tokenInput" placeholder="Admin token を入力" autocomplete="off">
  <button id="connectBtn" onclick="connect()">接続する</button>
</div>

<!-- Main screen -->
<div id="main">
  <div class="header">
    <span class="header-title">🕊 OQTA</span>
    <div class="conn-badge">
      <div class="conn-dot"></div>
      <span id="connLabel">接続中</span>
    </div>
  </div>

  <div class="receiver-list" id="receiverList"></div>

  <div class="center">
    <div class="send-wrap" id="sendWrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div id="bigBtn" onclick="sendHeart()">
        <span class="btn-icon">🫶</span>
        <span class="btn-label">SEND</span>
      </div>
    </div>
    <div id="statusMsg">受信機を選んで送信</div>
  </div>

  <div class="footer">
    <button onclick="reload()">↻ 受信機を更新</button>
  </div>
</div>

<script>
  const SERVER = "https://oqta-lite-receiver.fly.dev";
  let selectedId = null;
  let receivers  = [];

  // 起動時にトークン復元
  const saved = localStorage.getItem("oqta_admin_token");
  if (saved) {
    document.getElementById("tokenInput").value = saved;
    connect();
  }

  function token() { return localStorage.getItem("oqta_admin_token") || ""; }

  async function connect() {
    const t = document.getElementById("tokenInput").value.trim();
    if (!t) return;
    localStorage.setItem("oqta_admin_token", t);
    await loadReceivers();
  }

  function timeAgo(iso) {
    if (!iso) return "未接続";
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 30)   return "たった今";
    if (s < 60)   return `${s}秒前`;
    if (s < 3600) return `${Math.floor(s/60)}分前`;
    return `${Math.floor(s/3600)}時間前`;
  }

  function isOnline(iso) {
    return iso && (Date.now() - new Date(iso)) < 60000;
  }

  async function loadReceivers() {
    try {
      const res = await fetch(`${SERVER}/admin/receivers`, {
        headers: { "X-OQTA-Admin-Token": token() }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      receivers = await res.json();

      // Show main screen
      document.getElementById("setup").style.display = "none";
      document.getElementById("main").style.display  = "flex";

      renderReceivers();

      // Auto-select first online receiver
      const first = receivers.find(r => isOnline(r.last_online_at)) || receivers[0];
      if (first) selectReceiver(first.receiver_id);
    } catch(e) {
      alert("接続失敗: " + e.message);
    }
  }

  function renderReceivers() {
    const el = document.getElementById("receiverList");
    el.innerHTML = "";
    receivers.forEach(r => {
      const online = isOnline(r.last_online_at);
      const chip = document.createElement("div");
      chip.className = "receiver-chip" + (r.receiver_id === selectedId ? " selected" : "");
      chip.id = "chip_" + r.receiver_id;
      chip.onclick = () => selectReceiver(r.receiver_id);
      chip.innerHTML = `
        <div class="rdot ${online ? 'online' : ''}"></div>
        <div class="receiver-info">
          <div class="receiver-name">${r.device_model || "デバイス"}</div>
          <div class="receiver-meta">
            ${online ? "オンライン" : timeAgo(r.last_online_at)}
            ${r.battery_percent != null ? ` · 🔋${r.battery_percent}%` : ""}
            ${r.is_charging ? "⚡" : ""}
          </div>
        </div>
      `;
      el.appendChild(chip);
    });
  }

  function selectReceiver(id) {
    selectedId = id;
    document.querySelectorAll(".receiver-chip").forEach(c => c.classList.remove("selected"));
    const chip = document.getElementById("chip_" + id);
    if (chip) chip.classList.add("selected");
    const r = receivers.find(x => x.receiver_id === id);
    setStatus(r ? `${r.device_model || "デバイス"} に送信できます` : "", "");
  }

  function setStatus(msg, type) {
    const el = document.getElementById("statusMsg");
    el.textContent = msg;
    el.className = type || "";
  }

  async function sendHeart() {
    if (!selectedId) { setStatus("受信機を選んでください", "error"); return; }

    const btn  = document.getElementById("bigBtn");
    const wrap = document.getElementById("sendWrap");
    btn.classList.add("disabled");
    setStatus("送信中...", "");

    try {
      const res = await fetch(`${SERVER}/ring/${selectedId}`, {
        method: "POST",
        headers: {
          "X-OQTA-Admin-Token": token(),
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ sound: "default" })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      // 送信成功アニメーション
      wrap.classList.add("ringing");
      setStatus("✓ 送信しました！最大10秒で鳴ります", "ok");
      setTimeout(() => {
        wrap.classList.remove("ringing");
        btn.classList.remove("disabled");
        setStatus(`${receivers.find(r=>r.receiver_id===selectedId)?.device_model || "デバイス"} に送信できます`, "");
      }, 1800);
    } catch(e) {
      setStatus("送信失敗: " + e.message, "error");
      btn.classList.remove("disabled");
    }
  }

  function reload() {
    loadReceivers();
  }
</script>
</body>
</html>
